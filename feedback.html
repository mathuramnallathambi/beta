<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Feedback Form</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #FFB88C, #FF7EB3);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background: white;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      max-width: 400px;
      width: 90%;
      text-align: center;
    }
    .stars {
      font-size: 2.5em;
      margin: 15px 0;
    }
    .star {
      cursor: pointer;
      color: #ddd;
      transition: color 0.2s;
    }
    .star.selected {
      color: #FFD700;
    }
    textarea {
      width: 100%;
      height: 80px;
      margin-top: 10px;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-family: inherit;
      resize: vertical;
      box-sizing: border-box;
    }
    button {
      margin-top: 15px;
      padding: 10px 24px;
      background: #FF7EB3;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1em;
      cursor: pointer;
    }
    button:hover {
      background: #ff5f9e;
    }
    #thankyou {
      display: none;
      margin-top: 20px;
      color: #333;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>We'd love your feedback! 💬</h1>
    <p>How would you rate your experience?</p>
    <div class="stars" id="stars">
      <span class="star" data-value="1">★</span>
      <span class="star" data-value="2">★</span>
      <span class="star" data-value="3">★</span>
      <span class="star" data-value="4">★</span>
      <span class="star" data-value="5">★</span>
    </div>
    <textarea id="comment" placeholder="Tell us more (optional)..."></textarea>
    <br>
    <button onclick="submitFeedback()">Submit</button>
    <div id="thankyou">✅ Thanks for your feedback!</div>
  </div>

  <script>
    let rating = 0;
    const stars = document.querySelectorAll('.star');

    stars.forEach(star => {
      star.addEventListener('click', () => {
        rating = parseInt(star.getAttribute('data-value'));
        stars.forEach(s => {
          s.classList.toggle('selected', parseInt(s.getAttribute('data-value')) <= rating);
        });
      });
    });

    function submitFeedback() {
      if (rating === 0) {
        alert('Please select a star rating first!');
        return;
      }
      const comment = document.getElementById('comment').value;
      console.log('Rating:', rating, 'Comment:', comment);
      document.getElementById('thankyou').style.display = 'block';
      document.querySelector('button').style.display = 'none';
    }
  </script>
</body>
</html>
